name: Engine CI
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap postgresql-client
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: psql "$TEST_ADMIN_DATABASE_URL" -c 'CREATE DATABASE sie_test' && DATABASE_URL=$TEST_DATABASE_URL node scripts/migrate.mjs
      - run: npx -y playwright@1.56.1 install --with-deps chromium && npm install --no-save playwright@1.56.1
      - run: npm test
      - run: bash db/scripts/backup_restore_test.sh
        env: {DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sie_test}
      - run: npm run release:dry-run
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sie-engine:ci .
      - name: Container serves health (without a database it must report not-ready)
        run: |
          docker run -d --name sie -p 8080:8080 -e DATABASE_URL=postgres://none@127.0.0.1:1/none --entrypoint node sie-engine:ci apps/api/src/server.mjs
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ready)" != "200"
